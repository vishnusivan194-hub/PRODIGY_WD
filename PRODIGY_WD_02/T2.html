<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stopwatch</title>

    <link rel="stylesheet" href="T2.css">
</head>

<body>

    <div class="container">

        <h1>Stopwatch</h1>

        
        <div class="display">
            <span id="hours">00</span> :
            <span id="minutes">00</span> :
            <span id="seconds">00</span> :
            <span id="milliseconds">00</span>
        </div>

        
        <div class="buttons">

            <button id="startBtn" onclick="startStopwatch()">
                Start
            </button>

            <button id="pauseBtn" onclick="pauseStopwatch()">
                Pause
            </button>

            <button id="resetBtn" onclick="resetStopwatch()">
                Reset
            </button>

            <button id="lapBtn" onclick="recordLap()">
                Lap
            </button>

        </div>

        
        <div class="laps">

            <h2>Lap Times</h2>

            <ul id="lapList"></ul>

        </div>

    </div>

    <script src="T2.js"></script>

</body>

</html>
